    port: 9090
    transport: http
    description: MCP adapter for Google Cloud Compute Engine Google Compute Engine API — Firewalls. One tool per consumed
      operation, routed inline through this capability's consumes block.
    tools:
    - name: google-cloud-compute-engine-list
      description: Google Cloud Compute Engine List Firewalls
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: compute-firewalls.listfirewalls
      with:
        project: tools.project
      outputParameters:
      - type: object
        mapping: $.
