  description: 'Google Cloud Compute Engine Google Compute Engine API — Firewalls. 1 operations. Lead operation: Google Cloud
    Compute Engine List Firewalls. Self-contained Naftiko capability covering one Google Cloud Compute Engine business surface.'
  tags:
  - Google Cloud Compute Engine
  - Firewalls
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    GOOGLE_CLOUD_COMPUTE_ENGINE_API_KEY: GOOGLE_CLOUD_COMPUTE_ENGINE_API_KEY
capability:
