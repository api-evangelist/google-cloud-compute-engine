    namespace: compute-firewalls-rest
    port: 8080
    description: REST adapter for Google Cloud Compute Engine Google Compute Engine API — Firewalls. One Spectral-compliant
      resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/projects/{project}/global/firewalls
      name: projects-project-global-firewalls
      description: REST surface for projects-project-global-firewalls.
      operations:
      - method: GET
        name: listfirewalls
        description: Google Cloud Compute Engine List Firewalls
        call: compute-firewalls.listfirewalls
        with:
          project: rest.project
        outputParameters:
        - type: object
          mapping: $.
