  - type: http
    namespace: compute-firewalls
    baseUri: https://compute.googleapis.com/compute/v1
    description: Google Cloud Compute Engine Google Compute Engine API — Firewalls business capability. Self-contained, no
      shared references.
    resources:
    - name: projects-project-global-firewalls
      path: /projects/{project}/global/firewalls
      operations:
      - name: listfirewalls
        method: GET
        description: Google Cloud Compute Engine List Firewalls
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: project
          in: path
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.GOOGLE_CLOUD_COMPUTE_ENGINE_API_KEY}}'
  exposes:
